[plugin]
id = "first-word"
name = "First Move"
version = "0.2.0"
description = "Lets Astra speak first, in her own voice and personality: a morning hello, a late-night nudge, check-ins after long silence, callbacks to yesterday and your own reminders. Careful with your balance, with a built-in test."
author = "gerolheld"
license = "MIT"

[entry]
command = "python"
args = ["-m", "src.plugin"]
runtimes = ["python"]

[capabilities]
tools = true
event_handlers = true
ui_contributions = true

[permissions]
subscribe_events = { types = ["state_changed", "lock_state_changed", "speech_recognized", "chat_message", "tts_started", "tts_completed", "tts_interrupted"], reason = "Молчит, пока идёт разговор, Астра говорит или экран заблокирован; запоминает имя её инструмента экрана." }
send_chat_message = { reason = "Просит Астру самой начать разговор: отвечает её модель, голосом и характером." }

[platform]
os = ["linux", "windows"]
arch = ["x86_64"]

[config]
schema = """
