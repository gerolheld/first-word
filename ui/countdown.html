<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>First Move: счётчик</title>
<script src="http://astra-plugin.localhost/bridge/astra-bridge.js"></script>
<style>
  :root { color-scheme: normal; }
  html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; }
  body { color-scheme: light dark; font-family: var(--font-sans, system-ui, "Segoe UI", sans-serif); font-size: 12px;
         line-height: 1.3; color: var(--color-text, #e8ebf3); user-select: none; }
  /* Слой на всё окно не принимает клики: плашка только показывает, поэтому нажимать на неё не нужно. */
  .pill { position: fixed; box-sizing: border-box; max-width: 260px; padding: 7px 11px; border-radius: var(--radius-md, 10px);
          background: var(--color-overlay, rgba(30, 34, 46, .78)); box-shadow: var(--edge-control, 0 0 0 1px rgba(255, 255, 255, .12));
          backdrop-filter: blur(8px); }
  .bottom { bottom: 16px; } .top { top: 44px; } .right { right: 16px; } .left { left: 16px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .kind { font-weight: 600; }
  .time { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--color-accent, #8e9bff); }
  .sub { color: var(--color-text-muted, #9aa3b8); font-size: 11px; margin-top: 2px; white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; }
  .hidden { display: none; }
  * { scrollbar-width: none; }
</style>
</head>
<body>
<div class="pill hidden bottom right" id="pill">
  <div class="head"><span class="kind" id="kind"></span><span class="time" id="time"></span></div>
  <div class="sub" id="sub"></div>
  <div class="sub" id="then"></div>
</div>
<script>
  var data = null, fetchedAt = 0;
  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    if (d) return d + " д " + h + " ч";
    return h ? h + ":" + pad(m) + ":" + pad(s) : pad(m) + ":" + pad(s);
  }
  function place(name) {
    var pill = $("pill");
    pill.className = "pill " + (name.indexOf("вверху") === 0 ? "top " : "bottom ") + (name.indexOf("слева") > 0 ? "left" : "right");
  }
  function render() {
    var pill = $("pill");
    if (!data || !data.visible) { pill.classList.add("hidden"); return; }
    place(data.place || "внизу справа");
    var elapsed = (Date.now() - fetchedAt) / 1000;
    if (data.kind) {
      $("kind").textContent = "Далее: " + data.kind;
      $("time").textContent = fmt(data.left - elapsed);
      var sub = "в " + data.at + (data.delayed && data.why ? " · " + data.why : "");
      $("sub").textContent = data.paused ? "пауза до " + data.pause_until + " · " + sub : sub;
      var next = (data.more || [])[0];
      $("then").textContent = next ? "затем: " + next.kind + " в " + next.at : "";
    } else {
      $("kind").textContent = "Ничего по часам";
      $("time").textContent = "";
      $("sub").textContent = data.paused ? "пауза до " + data.pause_until : "ждёт условия";
      $("then").textContent = "";
    }
  }
  async function refresh() {
    try {
      data = await astra.callBackend("get_countdown", {});
      fetchedAt = Date.now();
    } catch (e) {
      data = null;
    }
    render();
  }
  setInterval(render, 1000);
  setInterval(refresh, 30000);
  refresh();
</script>
</body>
</html>
